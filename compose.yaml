services:
  orbit:
    build: .
    ports:
      - "127.0.0.1:43871:43871"
    environment:
      PORT: "43871"
      APP_ORIGINS: "http://localhost:43871,http://127.0.0.1:43871"
      VOICE_URL: "http://voice:8000"
    volumes:
      - orbit-data:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:43871/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
  voice:
    build: ./voice
    environment:
      WHISPER_MODEL: "medium"
      HF_HOME: "/models"
    volumes:
      - whisper-models:/models
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  orbit-data:
  whisper-models:
