services:
  orbit:
    build: .
    ports:
      - "127.0.0.1:43871:43871"
    environment:
      PORT: "43871"
      APP_ORIGINS: "http://localhost:43871,http://127.0.0.1:43871"
      VOICE_URL: "http://voice:8000"
      CODE_BROWSER_URL: "http://code-browser:8010"
      CODE_BROWSER_KEY_FILE: "/repo-control/key"
    volumes:
      - type: bind
        source: ./docker-data/orbit
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./docker-data/repo-control
        target: /repo-control
        bind:
          create_host_path: false
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:43871/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
  code-browser:
    build: ./services/code-browser
    environment:
      CODE_BROWSER_MAX_CACHE_BYTES: "${CODE_BROWSER_MAX_CACHE_BYTES:-21474836480}"
      CODE_BROWSER_FETCH_DEPTH: "${CODE_BROWSER_FETCH_DEPTH:-1}"
    volumes:
      - type: bind
        source: ./docker-data/repositories
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ./docker-data/repo-control
        target: /control
        bind:
          create_host_path: false
        read_only: true
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 768m
    pids_limit: 64
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  voice:
    build: ./services/voice
    environment:
      WHISPER_MODEL: "medium"
      # Optional spelling hints; set WHISPER_HOTWORDS="" to disable.
      WHISPER_HOTWORDS: "${WHISPER_HOTWORDS-Orbit, Azure DevOps, GitHub, pull request, review, merge, diff, тикет, теги, критерии приёмки, локальное поручение}"
      HF_HOME: "/models"
    volumes:
      - type: bind
        source: ./docker-data/whisper
        target: /models
        bind:
          create_host_path: false
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
